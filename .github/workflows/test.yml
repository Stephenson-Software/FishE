name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pygame -r requirements.txt

    - name: Run tests with coverage
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
      run: |
        python -m pytest --verbose -vv --cov=src --cov-report=term-missing --cov-report=xml:cov.xml
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./cov.xml
        fail_ci_if_error: false
      continue-on-error: true

  docker:
    # The image runs web/build_zip.py itself, from what the Dockerfile copied
    # in; this builds it and checks the bundle it made carries the location
    # stills (RFC 0025), which a missing COPY line would silently drop.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build the image
      run: docker build -t fishe .
    - name: The image's bundle carries the location stills
      run: |
        # Every still the bundled manifest names - each place, and one home
        # per housing rung - must have its picture in the bundle.
        docker run --rm fishe python3 -c "import json, zipfile; z=zipfile.ZipFile('web/game.zip'); n=set(z.namelist()); keys=json.loads(z.read('art/stills.json'))['stills']; assert {'docks','home-rented','home-manor'} <= set(keys), sorted(keys); missing=[k for k in keys if 'pictures/%s.png' % k not in n]; assert not missing, missing; print('bundle carries %d stills' % len(keys))"
