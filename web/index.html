<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishE</title>
<!-- The renderer, styles, boot script and Worker come from the tak package,
     served at /tak/ by web/serve.py. Only what is on this page is FishE's: the
     title, the tagline, and the TakBoot configuration - including the
     IndexedDB name, which is what keeps every existing browser save loading. -->
<link rel="stylesheet" href="/tak/client.css">
<style>
  /* Boot progress, shown until the first screen arrives. */
  .status { color: #7fb0d0; margin: 1rem 0; }
  .status.error { color: #ff8a8a; }
  /* A small credit line under the tip, outside #app so it never covers play. */
  .credit { font-size: .7rem; color: #6a8aa0; margin-top: .5rem; }
  .credit a { color: #7fb0d0; }
</style>
</head>
<body>
<h2>FishE <span class="tagline">— fish a seaside village and build a fortune of $10,000</span></h2>
<div id="status" class="status">Starting&hellip;</div>
<div id="app"></div>
<p class="controls">Tip: click an option or press its number key (1-9). Enter or Space continues. Your saved games live in this browser.</p>
<footer class="credit">More by Daniel Stephenson &rarr; <a href="https://danielstephenson.dev">danielstephenson.dev</a></footer>
<script src="/tak/client.js"></script>
<script src="/tak/boot.js"></script>
<script>
TakBoot.start({
  idbName: "fishe-saves",
  saveDirEnv: "FISHE_SAVE_DIR",
  bundleUrl: "/web/game.zip",
  entry: "web/pyodide_main.py",
  logPrefix: "[fishe]",
  messages: { download: "Downloading the village…", start: "Casting off…" },
});
</script>
</body>
</html>
